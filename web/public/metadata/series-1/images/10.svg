  <ellipse cx="200" cy="188" rx="42" ry="16" fill="#111111"/>

  
      <ellipse cx="168" cy="220" rx="10" ry="12" fill="#111"/>
      <ellipse cx="232" cy="220" rx="10" ry="12" fill="#111"/>
