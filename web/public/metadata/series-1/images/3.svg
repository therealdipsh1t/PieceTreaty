<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Legally Mime #3">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1c1028" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1c1028" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="#1c1028"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <rect width="400" height="400" fill="url(#spot)"/>
  
      <circle cx="80" cy="60" r="40" fill="#f0b429" opacity="0.12"/>
      <circle cx="320" cy="80" r="50" fill="#f0b429" opacity="0.1"/>
    
  <rect x="0" y="320" width="400" height="80" fill="#2a1838"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#f0b429" stroke-width="2" opacity="0.4"/>

  <!-- body -->
  <ellipse cx="200" cy="340" rx="70" ry="28" fill="#1a1a2e" stroke="#c9a227" stroke-width="3"/>
  <rect x="145" y="300" width="110" height="55" rx="8" fill="#1a1a2e" stroke="#c9a227" stroke-width="3"/>
  

  <!-- neck -->
  <rect x="185" y="275" width="30" height="30" fill="#f2e6d8"/>

  <!-- head -->
  <circle cx="200" cy="230" r="58" fill="#f7efe4" stroke="#111" stroke-width="3"/>
  <!-- mime white face oval -->
  <ellipse cx="200" cy="235" rx="48" ry="50" fill="#ffffff" opacity="0.92"/>

  <!-- beret / hair mark -->
  <path d="M150 200 Q200 155 250 200" fill="#c9a227" opacity="0.9"/>
  <ellipse cx="200" cy="188" rx="42" ry="16" fill="#c9a227"/>

  
    <ellipse cx="168" cy="222" rx="9" ry="11" fill="#111"/>
    <ellipse cx="232" cy="222" rx="9" ry="11" fill="#111"/>
    <circle cx="170" cy="219" r="2.5" fill="#fff"/>
    <circle cx="234" cy="219" r="2.5" fill="#fff"/>
  
  <path d="M178 275 Q200 290 222 275" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- rosy cheeks -->
  <circle cx="160" cy="245" r="8" fill="#f5a9b8" opacity="0.35"/>
  <circle cx="240" cy="245" r="8" fill="#f5a9b8" opacity="0.35"/>

  
        <g transform="translate(250,200)" opacity="0.85">
          <rect x="0" y="0" width="70" height="70" fill="none" stroke="#f0b429" stroke-width="2" stroke-dasharray="6 4"/>
          <circle cx="0" cy="0" r="3" fill="#f0b429"/>
          <circle cx="70" cy="0" r="3" fill="#f0b429"/>
          <circle cx="0" cy="70" r="3" fill="#f0b429"/>
          <circle cx="70" cy="70" r="3" fill="#f0b429"/>
        </g>

  <!-- frame + labels -->
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="#f0b429" stroke-width="2" opacity="0.5" rx="12"/>
  <text x="24" y="40" fill="#f0b429" font-family="ui-monospace, monospace" font-size="14" font-weight="600">#3</text>
  <text x="376" y="40" text-anchor="end" fill="#9b95b3" font-family="ui-monospace, monospace" font-size="12">Common</text>
  <text x="200" y="382" text-anchor="middle" fill="#ffffff" opacity="0.55" font-family="ui-monospace, monospace" font-size="11">Series 1 - Classics</text>
</svg>
