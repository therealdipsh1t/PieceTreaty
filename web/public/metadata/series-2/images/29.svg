<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Legally Mime #29">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a1410" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a1410" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="#1a1410"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <rect width="400" height="400" fill="url(#spot)"/>
  
      <rect x="30" y="80" width="50" height="200" fill="#d4a574" opacity="0.08" rx="4"/>
      <rect x="320" y="80" width="50" height="200" fill="#d4a574" opacity="0.08" rx="4"/>
    
  <rect x="0" y="320" width="400" height="80" fill="#2a2018"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#d4a574" stroke-width="2" opacity="0.4"/>

  <!-- body -->
  <ellipse cx="200" cy="340" rx="70" ry="28" fill="#0a0a0a" stroke="#4de1c1" stroke-width="3"/>
  <rect x="145" y="300" width="110" height="55" rx="8" fill="#0a0a0a" stroke="#4de1c1" stroke-width="3"/>
  

  <!-- neck -->
  <rect x="185" y="275" width="30" height="30" fill="#f2e6d8"/>

  <!-- head -->
  <circle cx="200" cy="230" r="58" fill="#f7efe4" stroke="#111" stroke-width="3"/>
  <!-- mime white face oval -->
  <ellipse cx="200" cy="235" rx="48" ry="50" fill="#ffffff" opacity="0.92"/>

  <!-- beret / hair mark -->
  <path d="M150 200 Q200 155 250 200" fill="#4de1c1" opacity="0.9"/>
  <ellipse cx="200" cy="188" rx="42" ry="16" fill="#4de1c1"/>

  
    <ellipse cx="168" cy="222" rx="9" ry="11" fill="#111"/>
    <ellipse cx="232" cy="222" rx="9" ry="11" fill="#111"/>
    <circle cx="170" cy="219" r="2.5" fill="#fff"/>
    <circle cx="234" cy="219" r="2.5" fill="#fff"/>
  
  <line x1="180" y1="268" x2="220" y2="268" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- rosy cheeks -->
  <circle cx="160" cy="245" r="8" fill="#f5a9b8" opacity="0.35"/>
  <circle cx="240" cy="245" r="8" fill="#f5a9b8" opacity="0.35"/>

  
        <g transform="translate(262,245)">
          <rect x="0" y="0" width="36" height="48" rx="2" fill="#1a3a5c" stroke="#d4a574" stroke-width="1.5"/>
          <text x="18" y="28" text-anchor="middle" font-size="9" fill="#f0d78c" font-family="serif">§</text>
        </g>

  <!-- frame + labels -->
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.5" rx="12"/>
  <text x="24" y="40" fill="#d4a574" font-family="ui-monospace, monospace" font-size="14" font-weight="600">#29</text>
  <text x="376" y="40" text-anchor="end" fill="#4de1c1" font-family="ui-monospace, monospace" font-size="12">Uncommon</text>
  <text x="200" y="382" text-anchor="middle" fill="#ffffff" opacity="0.55" font-family="ui-monospace, monospace" font-size="11">Series 2 - Legal Briefs</text>
</svg>
